---
# Subscription Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription-service
  namespace: distributed-events
  labels:
    app: subscription-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subscription-service
  template:
    metadata:
      labels:
        app: subscription-service
    spec:
      serviceAccountName: distributed-events-sa
      containers:
      - name: subscription-service
        image: subscription-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
        env:
        - name: PORT
          value: "5002"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AWS_SECRET_ACCESS_KEY
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 30
          periodSeconds: 10

---
# Subscription Service
apiVersion: v1
kind: Service
metadata:
  name: subscription-service
  namespace: distributed-events
spec:
  type: ClusterIP
  selector:
    app: subscription-service
  ports:
  - port: 5002
    targetPort: 5002


