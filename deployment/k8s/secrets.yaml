# IMPORTANT: This is a template. In production:
# 1. Never commit actual secrets to git
# 2. Use AWS Secrets Manager or Kubernetes Secrets with encryption
# 3. Use external-secrets operator or sealed-secrets

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: distributed-events
type: Opaque
stringData:
  # JWT Secret (base64 encode in production)
  JWT_SECRET: "your-secret-key-change-in-production-make-it-very-long-and-secure"
  
  # AWS Credentials (use IAM roles for production)
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  
  # RabbitMQ Password
  RABBITMQ_PASSWORD: "guest"
  
  # SNS Topic ARN
  NOTIFICATIONS_SNS_TOPIC_ARN: ""
  
  # S3 Bucket
  EVENT_MEDIA_BUCKET: "event-media-bucket"


