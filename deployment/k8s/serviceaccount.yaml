# Service Account for AWS IAM roles (IRSA - IAM Roles for Service Accounts)
# This allows pods to access AWS services without hardcoded credentials

apiVersion: v1
kind: ServiceAccount
metadata:
  name: distributed-events-sa
  namespace: distributed-events
  annotations:
    # Replace with your AWS IAM role ARN for EKS
    eks.amazonaws.com/role-arn: arn:aws:iam::YOUR_ACCOUNT_ID:role/distributed-events-eks-role

---
# Role for accessing K8s resources (if needed)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: distributed-events-role
  namespace: distributed-events
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]

---
# Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: distributed-events-rolebinding
  namespace: distributed-events
subjects:
- kind: ServiceAccount
  name: distributed-events-sa
  namespace: distributed-events
roleRef:
  kind: Role
  name: distributed-events-role
  apiGroup: rbac.authorization.k8s.io


