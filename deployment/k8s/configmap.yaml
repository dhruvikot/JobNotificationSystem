apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: distributed-events
data:
  # RabbitMQ Configuration
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  RABBITMQ_EXCHANGE: "events.topic"
  RABBITMQ_QUEUE: "dispatcher_queue"

  # AWS Configuration
  AWS_REGION: "us-east-1"
  DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"  # For local development with DynamoDB Local
  
  # DynamoDB Tables
  USERS_TABLE: "Users"
  SUBSCRIPTIONS_TABLE: "Subscriptions"
  EVENTS_TABLE: "Events"
  TOPIC_POPULARITY_TABLE: "TopicPopularity"
  
  # Service URLs (internal)
  AUTH_SERVICE_URL: "http://auth-service:5001"
  SUBSCRIPTION_SERVICE_URL: "http://subscription-service:5002"
  PUBLISHER_SERVICE_URL: "http://publisher-service:5003"
  DISPATCHER_SERVICE_URL: "http://notification-dispatcher-service:5004"
  GOSSIP_AGENT_URL: "http://gossip-agent-service:5006"
  
  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  
  # Flask Environment
  FLASK_ENV: "development"


