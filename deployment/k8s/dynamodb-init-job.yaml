---
# ConfigMap containing the initialization script
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamodb-init-script
  namespace: distributed-events
data:
  init-tables.sh: |
    #!/bin/sh
    set -e
    
    DYNAMODB_ENDPOINT="http://dynamodb-local:8000"
    AWS_REGION="us-east-1"
    
    echo "Waiting for DynamoDB Local to be ready..."
    for i in $(seq 1 30); do
        if aws dynamodb list-tables --endpoint-url $DYNAMODB_ENDPOINT --region $AWS_REGION --no-cli-pager 2>/dev/null; then
            echo "DynamoDB Local is ready!"
            break
        fi
        echo "Waiting... ($i/30)"
        sleep 2
    done
    
    echo "Creating Users table..."
    aws dynamodb create-table \
        --endpoint-url $DYNAMODB_ENDPOINT \
        --region $AWS_REGION \
        --table-name Users \
        --attribute-definitions \
            AttributeName=user_id,AttributeType=S \
            AttributeName=email,AttributeType=S \
        --key-schema \
            AttributeName=user_id,KeyType=HASH \
        --global-secondary-indexes \
            "IndexName=EmailIndex,KeySchema=[{AttributeName=email,KeyType=HASH}],Projection={ProjectionType=ALL},ProvisionedThroughput={ReadCapacityUnits=5,WriteCapacityUnits=5}" \
        --provisioned-throughput \
            ReadCapacityUnits=5,WriteCapacityUnits=5 \
        --no-cli-pager 2>/dev/null || echo "Users table already exists"
    
    echo "Creating Subscriptions table..."
    aws dynamodb create-table \
        --endpoint-url $DYNAMODB_ENDPOINT \
        --region $AWS_REGION \
        --table-name Subscriptions \
        --attribute-definitions \
            AttributeName=user_id,AttributeType=S \
            AttributeName=topic,AttributeType=S \
        --key-schema \
            AttributeName=user_id,KeyType=HASH \
            AttributeName=topic,KeyType=RANGE \
        --global-secondary-indexes \
            "IndexName=TopicIndex,KeySchema=[{AttributeName=topic,KeyType=HASH}],Projection={ProjectionType=ALL},ProvisionedThroughput={ReadCapacityUnits=5,WriteCapacityUnits=5}" \
        --provisioned-throughput \
            ReadCapacityUnits=5,WriteCapacityUnits=5 \
        --no-cli-pager 2>/dev/null || echo "Subscriptions table already exists"
    
    echo "Creating Events table..."
    aws dynamodb create-table \
        --endpoint-url $DYNAMODB_ENDPOINT \
        --region $AWS_REGION \
        --table-name Events \
        --attribute-definitions \
            AttributeName=event_id,AttributeType=S \
            AttributeName=created_at,AttributeType=N \
            AttributeName=topic,AttributeType=S \
        --key-schema \
            AttributeName=event_id,KeyType=HASH \
        --global-secondary-indexes \
            "IndexName=TopicIndex,KeySchema=[{AttributeName=topic,KeyType=HASH},{AttributeName=created_at,KeyType=RANGE}],Projection={ProjectionType=ALL},ProvisionedThroughput={ReadCapacityUnits=5,WriteCapacityUnits=5}" \
        --provisioned-throughput \
            ReadCapacityUnits=5,WriteCapacityUnits=5 \
        --no-cli-pager 2>/dev/null || echo "Events table already exists"
    
    echo ""
    echo "Listing all tables:"
    aws dynamodb list-tables --endpoint-url $DYNAMODB_ENDPOINT --region $AWS_REGION --no-cli-pager
    
    echo ""
    echo "DynamoDB Local initialization complete!"

---
# Job to initialize DynamoDB tables
apiVersion: batch/v1
kind: Job
metadata:
  name: dynamodb-init
  namespace: distributed-events
spec:
  ttlSecondsAfterFinished: 100
  template:
    metadata:
      labels:
        app: dynamodb-init
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-dynamodb
        image: busybox:1.36
        command: 
        - sh
        - -c
        - |
          echo "Waiting for DynamoDB Local service to be available..."
          until nc -z dynamodb-local 8000; do
            echo "DynamoDB Local not ready yet... waiting"
            sleep 3
          done
          echo "DynamoDB Local service is available!"
      containers:
      - name: init-tables
        image: amazon/aws-cli:latest
        command: ["/bin/sh", "/scripts/init-tables.sh"]
        env:
        - name: AWS_ACCESS_KEY_ID
          value: "fakeAccessKeyId"
        - name: AWS_SECRET_ACCESS_KEY
          value: "fakeSecretAccessKey"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        volumeMounts:
        - name: init-script
          mountPath: /scripts
      volumes:
      - name: init-script
        configMap:
          name: dynamodb-init-script
          defaultMode: 0755
