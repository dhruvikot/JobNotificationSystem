# Docker Compose for local development with distributed replicas
# Implements 3-node architecture for Publisher and Dispatcher services
# For production, use Kubernetes manifests in deployment/k8s/

services:
  # Redis Cache for Notifications
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - distributed-events-net

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - distributed-events-net

  # API Gateway (Load balancer will distribute to publisher replicas)
  api-gateway:
    build:
      context: ../../backend
      dockerfile: api_gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:5001
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:5002
      PUBLISHER_SERVICE_URL: http://publisher-service-1:5003
      DISPATCHER_SERVICE_URL: http://notification-dispatcher-1:5004
      FLASK_ENV: development
    depends_on:
      - auth-service
      - subscription-service
      - publisher-service-1
      - publisher-service-2
      - publisher-service-3
      - notification-dispatcher-1
      - notification-dispatcher-2
      - notification-dispatcher-3
    networks:
      - distributed-events-net

  # Auth Service
  auth-service:
    build:
      context: ../../backend
      dockerfile: auth_service/Dockerfile
    container_name: auth-service
    environment:
      PORT: 5001
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      USERS_TABLE: Users
      FLASK_ENV: development
    networks:
      - distributed-events-net

  # Subscription Service
  subscription-service:
    build:
      context: ../../backend
      dockerfile: subscription_service/Dockerfile
    container_name: subscription-service
    environment:
      PORT: 5002
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SUBSCRIPTIONS_TABLE: Subscriptions
      FLASK_ENV: development
    networks:
      - distributed-events-net

  # ============================================================================
  # Publisher Service - 3 Replicas with Leader Election
  # ============================================================================
  
  publisher-service-1:
    build:
      context: ../../backend
      dockerfile: publisher_service/Dockerfile
    container_name: publisher-service-1
    hostname: publisher-service-1
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      NODE_ID: publisher-1
      NODE_URL: http://publisher-service-1:5003
      PEER_NODES: http://publisher-service-2:5013,http://publisher-service-3:5023
      PYTHONUNBUFFERED: 1
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      EVENTS_TABLE: Events
      EVENT_MEDIA_BUCKET: ${EVENT_MEDIA_BUCKET}
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:5002
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: events.topic
      FLASK_ENV: development
    depends_on:
      - rabbitmq
      - subscription-service
    networks:
      - distributed-events-net

  publisher-service-2:
    build:
      context: ../../backend
      dockerfile: publisher_service/Dockerfile
    container_name: publisher-service-2
    hostname: publisher-service-2
    ports:
      - "5013:5013"
    environment:
      PORT: 5013
      NODE_ID: publisher-2
      NODE_URL: http://publisher-service-2:5013
      PEER_NODES: http://publisher-service-1:5003,http://publisher-service-3:5023
      PYTHONUNBUFFERED: 1
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      EVENTS_TABLE: Events
      EVENT_MEDIA_BUCKET: ${EVENT_MEDIA_BUCKET}
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:5002
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: events.topic
      FLASK_ENV: development
    depends_on:
      - rabbitmq
      - subscription-service
    networks:
      - distributed-events-net

  publisher-service-3:
    build:
      context: ../../backend
      dockerfile: publisher_service/Dockerfile
    container_name: publisher-service-3
    hostname: publisher-service-3
    ports:
      - "5023:5023"
    environment:
      PORT: 5023
      NODE_ID: publisher-3
      NODE_URL: http://publisher-service-3:5023
      PEER_NODES: http://publisher-service-1:5003,http://publisher-service-2:5013
      PYTHONUNBUFFERED: 1
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      EVENTS_TABLE: Events
      EVENT_MEDIA_BUCKET: ${EVENT_MEDIA_BUCKET}
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:5002
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: events.topic
      FLASK_ENV: development
    depends_on:
      - rabbitmq
      - subscription-service
    networks:
      - distributed-events-net

  # ============================================================================
  # Notification Dispatcher - 3 Replicas with Leader Election & Gossip
  # ============================================================================
  
  notification-dispatcher-1:
    build:
      context: ../../backend
      dockerfile: notification_dispatcher/Dockerfile
    container_name: notification-dispatcher-1
    hostname: notification-dispatcher-1
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      NODE_ID: dispatcher-1
      NODE_URL: http://notification-dispatcher-1:5004
      PEER_NODES: http://notification-dispatcher-2:5014,http://notification-dispatcher-3:5024
      PYTHONUNBUFFERED: 1
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      NOTIFICATIONS_SNS_TOPIC_ARN: ${NOTIFICATIONS_SNS_TOPIC_ARN}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: events.topic
      GOSSIP_AGENT_URL: http://gossip-agent-1:5006
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLASK_ENV: development
    depends_on:
      - rabbitmq
      - gossip-agent-1
      - redis
    networks:
      - distributed-events-net

  notification-dispatcher-2:
    build:
      context: ../../backend
      dockerfile: notification_dispatcher/Dockerfile
    container_name: notification-dispatcher-2
    hostname: notification-dispatcher-2
    ports:
      - "5014:5014"
    environment:
      PORT: 5014
      NODE_ID: dispatcher-2
      NODE_URL: http://notification-dispatcher-2:5014
      PEER_NODES: http://notification-dispatcher-1:5004,http://notification-dispatcher-3:5024
      PYTHONUNBUFFERED: 1
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      NOTIFICATIONS_SNS_TOPIC_ARN: ${NOTIFICATIONS_SNS_TOPIC_ARN}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: events.topic
      GOSSIP_AGENT_URL: http://gossip-agent-1:5006
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLASK_ENV: development
    depends_on:
      - rabbitmq
      - gossip-agent-1
      - redis
    networks:
      - distributed-events-net

  notification-dispatcher-3:
    build:
      context: ../../backend
      dockerfile: notification_dispatcher/Dockerfile
    container_name: notification-dispatcher-3
    hostname: notification-dispatcher-3
    ports:
      - "5024:5024"
    environment:
      PORT: 5024
      NODE_ID: dispatcher-3
      NODE_URL: http://notification-dispatcher-3:5024
      PEER_NODES: http://notification-dispatcher-1:5004,http://notification-dispatcher-2:5014
      PYTHONUNBUFFERED: 1
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      NOTIFICATIONS_SNS_TOPIC_ARN: ${NOTIFICATIONS_SNS_TOPIC_ARN}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: events.topic
      GOSSIP_AGENT_URL: http://gossip-agent-1:5006
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLASK_ENV: development
    depends_on:
      - rabbitmq
      - gossip-agent-1
      - redis
    networks:
      - distributed-events-net

  # ============================================================================
  # Gossip Agent - 3 Replicas for State Synchronization
  # ============================================================================
  
  gossip-agent-1:
    build:
      context: ../../backend
      dockerfile: gossip_agent/Dockerfile
    container_name: gossip-agent-1
    hostname: gossip-agent-1
    ports:
      - "5006:5006"
    environment:
      PORT: 5006
      NODE_ID: gossip-1
      GOSSIP_PEERS: http://gossip-agent-2:5007,http://gossip-agent-3:5008
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      FLASK_ENV: development
    networks:
      - distributed-events-net

  gossip-agent-2:
    build:
      context: ../../backend
      dockerfile: gossip_agent/Dockerfile
    container_name: gossip-agent-2
    hostname: gossip-agent-2
    ports:
      - "5007:5007"
    environment:
      PORT: 5007
      NODE_ID: gossip-2
      GOSSIP_PEERS: http://gossip-agent-1:5006,http://gossip-agent-3:5008
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      FLASK_ENV: development
    networks:
      - distributed-events-net

  gossip-agent-3:
    build:
      context: ../../backend
      dockerfile: gossip_agent/Dockerfile
    container_name: gossip-agent-3
    hostname: gossip-agent-3
    ports:
      - "5008:5008"
    environment:
      PORT: 5008
      NODE_ID: gossip-3
      GOSSIP_PEERS: http://gossip-agent-1:5006,http://gossip-agent-2:5007
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      FLASK_ENV: development
    networks:
      - distributed-events-net

  # Frontend Web Application
  frontend-web:
    build:
      context: ../../frontend/web
      dockerfile: Dockerfile
    container_name: frontend-web
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_WEBSOCKET_URL: ws://localhost:5004/ws/notifications
    depends_on:
      - api-gateway
    networks:
      - distributed-events-net

networks:
  distributed-events-net:
    driver: bridge

volumes:
  rabbitmq_data:
  redis_data:
